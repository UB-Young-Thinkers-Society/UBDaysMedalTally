<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UBDays 2026 Medal Tally</title>
    <link rel="stylesheet" href="css/live-feed.css">
    <link rel="stylesheet" href="css/details-styles.css">
    <link rel="icon" href="img/2026/ubdays2026.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div class="tally-card">
        <!-- Center Watermark Logo -->
        <div class="watermark-container" aria-hidden="true">
            <img src="img/2026/ubdays2026.png" class="card-watermark" alt="">
        </div>

        <!-- Top Gradient Header Banner (Text + Logo only, size increased by 15%) -->
        <header class="gradient-header-banner">
            <div class="banner-branding">
                <img src="img/2026/ubdays2026.png" alt="UBDays 2026 Logo" class="banner-logo">
                <div class="banner-title-group">
                    <h1 class="banner-title">OFFICIAL MEDAL TALLY</h1>
                    <div class="banner-subtitle" id="last-updated">as of Loading...</div>
                </div>
            </div>
        </header>

        <!-- Filter Bar (Image #4) -->
        <div class="details-filter-bar">
            <!-- Category Searchable Dropdown -->
            <div class="custom-select-wrapper" id="category-select-wrapper">
                <div class="custom-select-box" id="filter-category-box" data-category-id="null">
                    <input type="text" id="filter-category-search" class="custom-select-search" placeholder="Loading Categories..." disabled>
                    <span class="custom-select-arrow"></span>
                </div>
                <div class="custom-select-list hidden" id="category-list">
                    <!-- Category options populated by JS -->
                </div>
            </div>

            <!-- Event Searchable Dropdown -->
            <div class="custom-select-wrapper" id="event-select-wrapper">
                <div class="custom-select-box" id="filter-event-box" data-event-id="null">
                    <input type="text" id="filter-event-search" class="custom-select-search" placeholder="Select Category First" disabled>
                    <span class="custom-select-arrow"></span>
                </div>
                <div class="custom-select-list hidden" id="event-list">
                    <!-- Event options populated by JS -->
                </div>
            </div>
            
            <!-- Department Dropdown -->
            <div class="custom-select-wrapper">
                <div class="custom-select-box" id="filter-department" data-team-id="null">
                    <span class="placeholder">Enter Department</span>
                </div>
                <div class="custom-select-list hidden" id="department-list">
                    <!-- Team options populated by JS -->
                </div>
            </div>
        </div>

        <!-- Details Views (Image #4) -->
        <div id="details-view-wrapper">
            <!-- View 1: Category/Event Rankings -->
            <div id="category-details-view">
                <div class="details-title-bar">
                    <h2 id="details-title">Please select a category</h2>
                </div>
                <table class="tally-table details-rank-list">
                    <thead>
                        <tr id="tally-headers">
                            <th class="col-dept">Department</th>
                            <th class="gold">Gold</th>
                            <th class="silver">Silver</th>
                            <th class="bronze">Bronze</th>
                            <th class="total">Total</th>
                        </tr>
                        <tr id="rank-header" style="display: none;">
                            <th class="col-dept">Department</th>
                            <th style="text-align: center;">Rank</th>
                        </tr>
                    </thead>
                    <tbody id="category-rankings-body">
                        <tr>
                            <td colspan="5" class="details-message empty">
                                Please select a category to see rankings.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- View 2: Department-Specific Results (Hidden by default) -->
            <div id="department-details-view" style="display: none;">
                <!-- Dynamically built by js/details-category.js -->
            </div>
        </div>

        <footer class="footer">
            <span>Developed by <img src="img/ubytesLogo@3x.png" class="ub-logo" alt="UBYTeS Logo"> 
                <a href="about-us.html" style="color: inherit; text-decoration: underline;">UBYTeS - University of Bohol Young Thinkers Society</a>
            </span>
        </footer>
    </div>

    <!-- Floating Bottom Navigation Pill (Sticky & Centered 24px above bottom) -->
    <div class="nav-bar-container">
        <div class="banner-pill" role="group" aria-label="Page navigation">
            <button class="pill-btn" onclick="window.location.href='index.html?tab=live'">LIVE COUNT</button>
            <button class="pill-btn" onclick="window.location.href='index.html?tab=juniors'">JUNIORS LEAGUE</button>
            <button class="pill-btn active" aria-current="page">DETAILS</button>
        </div>
    </div>

    <script src="js/details-category.js?v=20261029_v1" defer></script>
</body>
</html>
