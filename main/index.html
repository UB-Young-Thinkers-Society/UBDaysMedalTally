<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UBDays 2026 Medal Tally</title>
    <link rel="stylesheet" href="css/live-feed.css">
    <link rel="icon" href="img/2026/ubdays2026.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div class="tally-card">
        <!-- Center Watermark Logo -->
        <div class="watermark-container" aria-hidden="true">
            <img src="img/2026/ubdays2026.png" class="card-watermark" alt="">
        </div>

        <!-- Top Gradient Header Banner (Text + Logo only, size increased by 15%) -->
        <header class="gradient-header-banner">
            <div class="banner-branding">
                <img src="img/2026/ubdays2026.png" alt="UBDays 2026 Logo" class="banner-logo">
                <div class="banner-title-group">
                    <h1 class="banner-title">OFFICIAL MEDAL TALLY</h1>
                    <div class="banner-subtitle" id="last-updated">as of Loading...</div>
                </div>
            </div>
        </header>

        <!-- Live Medal Tally Table (Images #1 & #5) -->
        <div class="table-scroll">
            <table class="tally-table">
                <thead>
                    <tr>
                        <th class="col-dept sortable" data-sort-key="name">
                            <div class="th-content">
                                <span>Department</span>
                                <span class="sort-chevrons" aria-hidden="true">
                                    <svg class="chevron-up" viewBox="0 0 8 5" fill="none"><path d="M1 4L4 1L7 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                    <svg class="chevron-down" viewBox="0 0 8 5" fill="none"><path d="M1 1L4 4L7 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </span>
                            </div>
                        </th>
                        <th class="gold sortable" data-sort-key="gold">
                            <div class="th-content center">
                                <span>Gold</span>
                                <span class="sort-chevrons" aria-hidden="true">
                                    <svg class="chevron-up" viewBox="0 0 8 5" fill="none"><path d="M1 4L4 1L7 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                    <svg class="chevron-down" viewBox="0 0 8 5" fill="none"><path d="M1 1L4 4L7 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </span>
                            </div>
                        </th>
                        <th class="silver sortable" data-sort-key="silver">
                            <div class="th-content center">
                                <span>Silver</span>
                                <span class="sort-chevrons" aria-hidden="true">
                                    <svg class="chevron-up" viewBox="0 0 8 5" fill="none"><path d="M1 4L4 1L7 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                    <svg class="chevron-down" viewBox="0 0 8 5" fill="none"><path d="M1 1L4 4L7 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </span>
                            </div>
                        </th>
                        <th class="bronze sortable" data-sort-key="bronze">
                            <div class="th-content center">
                                <span>Bronze</span>
                                <span class="sort-chevrons" aria-hidden="true">
                                    <svg class="chevron-up" viewBox="0 0 8 5" fill="none"><path d="M1 4L4 1L7 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                    <svg class="chevron-down" viewBox="0 0 8 5" fill="none"><path d="M1 1L4 4L7 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </span>
                            </div>
                        </th>
                        <th class="total sortable" data-sort-key="total">
                            <div class="th-content center">
                                <span>Total</span>
                                <span class="sort-chevrons" aria-hidden="true">
                                    <svg class="chevron-up" viewBox="0 0 8 5" fill="none"><path d="M1 4L4 1L7 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                    <svg class="chevron-down" viewBox="0 0 8 5" fill="none"><path d="M1 1L4 4L7 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                </span>
                            </div>
                        </th>
                    </tr>
                </thead>
                <tbody id="tally-body">
                    <!-- Loader Row -->
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 40px; font-weight: 600;">
                            Loading live medal tally...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <footer class="footer">
            <span>Developed by <img src="img/ubytesLogo@3x.png" class="ub-logo" alt="UBYTeS Logo"> 
                <a href="about-us.html" style="color: inherit; text-decoration: underline;">UBYTeS - University of Bohol Young Thinkers Society</a>
            </span>
        </footer>
    </div>

    <!-- Floating Bottom Navigation Pill (Sticky & Centered 24px above bottom) -->
    <div class="nav-bar-container">
        <div class="banner-pill" role="group" aria-label="Page navigation">
            <button class="pill-btn active" aria-current="page">LIVE COUNT</button>
            <button class="pill-btn" onclick="window.location.href='details-category.html'">DETAILS</button>
        </div>
    </div>

    <!-- Live Feed Logic with Sorting & Chevrons -->
    <script src="js/live-feed.js" defer></script>
</body>
</html>
